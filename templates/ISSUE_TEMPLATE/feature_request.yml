name: ✨ Feature Request
description: Proposer une nouvelle fonctionnalité
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options: ["Critique", "Haute", "Moyenne", "Basse"]
